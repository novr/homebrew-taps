name: Dispatch formula update

on:
  workflow_call:
    inputs:
      formula:
        required: true
        type: string
      version:
        required: true
        type: string
      url:
        required: false
        type: string
        default: ""
      sha256:
        required: true
        type: string
      desc:
        required: false
        type: string
        default: ""
      binary:
        required: false
        type: string
        default: ""
      test_match:
        required: false
        type: string
        default: ""
      license:
        required: false
        type: string
        default: MIT
      source_repo:
        required: false
        type: string
        default: ""
      service_config:
        required: false
        type: string
        default: ""
      service_run_args:
        required: false
        type: string
        default: ""
      service_config_source:
        required: false
        type: string
        default: ""
      completion_shells:
        required: false
        type: string
        default: ""
      completion_args:
        required: false
        type: string
        default: ""
      completion_format:
        required: false
        type: string
        default: ""
      binaries:
        required: false
        type: string
        default: ""
      aliases:
        required: false
        type: string
        default: ""
    secrets:
      NOVRD_BOT_CLIENT_ID:
        required: true
      NOVRD_BOT_KEY:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.NOVRD_BOT_CLIENT_ID }}
          private-key: ${{ secrets.NOVRD_BOT_KEY }}
          owner: novr
          repositories: homebrew-taps

      - name: Dispatch homebrew formula update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FORMULA: ${{ inputs.formula }}
          VERSION: ${{ inputs.version }}
          URL: ${{ inputs.url }}
          SHA256: ${{ inputs.sha256 }}
          DESC: ${{ inputs.desc }}
          BINARY: ${{ inputs.binary }}
          TEST_MATCH: ${{ inputs.test_match }}
          LICENSE: ${{ inputs.license }}
          SOURCE_REPO: ${{ inputs.source_repo != '' && inputs.source_repo || github.repository }}
          SERVICE_CONFIG: ${{ inputs.service_config }}
          SERVICE_RUN_ARGS: ${{ inputs.service_run_args }}
          SERVICE_CONFIG_SOURCE: ${{ inputs.service_config_source }}
          COMPLETION_SHELLS: ${{ inputs.completion_shells }}
          COMPLETION_ARGS: ${{ inputs.completion_args }}
          COMPLETION_FORMAT: ${{ inputs.completion_format }}
          BINARIES: ${{ inputs.binaries }}
          ALIASES: ${{ inputs.aliases }}
        shell: bash
        run: |
          set -euo pipefail
          BINARY="${BINARY:-${FORMULA}}"
          # repository_dispatch client_payload allows at most 10 top-level properties.
          # Core keys are shared with Cask; type-specific fields live in options.
          jq -n \
            --arg name "${FORMULA}" \
            --arg version "${VERSION}" \
            --arg sha256 "${SHA256}" \
            --arg desc "${DESC}" \
            --arg source_repo "${SOURCE_REPO}" \
            --arg binary "${BINARY}" \
            --arg test_match "${TEST_MATCH}" \
            --arg license "${LICENSE}" \
            --arg url "${URL}" \
            --arg service_config "${SERVICE_CONFIG}" \
            --arg service_run_args "${SERVICE_RUN_ARGS}" \
            --arg service_config_source "${SERVICE_CONFIG_SOURCE}" \
            --arg completion_shells "${COMPLETION_SHELLS}" \
            --arg completion_args "${COMPLETION_ARGS}" \
            --arg completion_format "${COMPLETION_FORMAT}" \
            --arg binaries "${BINARIES}" \
            --arg aliases "${ALIASES}" \
            '{
              event_type: "update-formula",
              client_payload: (
                {
                  name: $name,
                  version: $version,
                  sha256: $sha256,
                  source_repo: $source_repo,
                  options: (
                    {binary: $binary, license: $license}
                    + (if $test_match != "" then {test_match: $test_match} else {} end)
                    + (if $url != "" then {url: $url} else {} end)
                    + (if $service_config != "" then {service_config: $service_config} else {} end)
                    + (if $service_run_args != "" then {service_run_args: $service_run_args} else {} end)
                    + (if $service_config_source != "" then {service_config_source: $service_config_source} else {} end)
                    + (if $completion_shells != "" then {completion_shells: $completion_shells} else {} end)
                    + (if $completion_args != "" then {completion_args: $completion_args} else {} end)
                    + (if $completion_format != "" then {completion_format: $completion_format} else {} end)
                    + (if $binaries != "" then {binaries: $binaries} else {} end)
                    + (if $aliases != "" then {aliases: $aliases} else {} end)
                  )
                }
                + (if $desc != "" then {desc: $desc} else {} end)
              )
            }' | gh api repos/novr/homebrew-taps/dispatches --method POST --input -
