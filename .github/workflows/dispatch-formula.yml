name: Dispatch formula update

on:
  workflow_call:
    inputs:
      formula:
        required: true
        type: string
      version:
        required: true
        type: string
      url:
        required: true
        type: string
      sha256:
        required: true
        type: string
      desc:
        required: true
        type: string
      binary:
        required: true
        type: string
      test_match:
        required: true
        type: string
      license:
        required: false
        type: string
        default: MIT
      source_repo:
        required: false
        type: string
        default: ""
      service_config:
        required: false
        type: string
        default: ""
      service_run_args:
        required: false
        type: string
        default: ""
      service_config_source:
        required: false
        type: string
        default: ""
    secrets:
      NOVRD_BOT_CLIENT_ID:
        required: true
      NOVRD_BOT_KEY:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.NOVRD_BOT_CLIENT_ID }}
          private-key: ${{ secrets.NOVRD_BOT_KEY }}
          owner: novr
          repositories: homebrew-taps

      - name: Dispatch homebrew formula update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FORMULA: ${{ inputs.formula }}
          VERSION: ${{ inputs.version }}
          URL: ${{ inputs.url }}
          SHA256: ${{ inputs.sha256 }}
          DESC: ${{ inputs.desc }}
          BINARY: ${{ inputs.binary }}
          TEST_MATCH: ${{ inputs.test_match }}
          LICENSE: ${{ inputs.license }}
          SOURCE_REPO: ${{ inputs.source_repo != '' && inputs.source_repo || github.repository }}
          SERVICE_CONFIG: ${{ inputs.service_config }}
          SERVICE_RUN_ARGS: ${{ inputs.service_run_args }}
          SERVICE_CONFIG_SOURCE: ${{ inputs.service_config_source }}
        shell: bash
        run: |
          set -euo pipefail
          HOMEPAGE="https://github.com/${SOURCE_REPO}"
          jq -n \
            --arg formula "${FORMULA}" \
            --arg version "${VERSION}" \
            --arg url "${URL}" \
            --arg sha256 "${SHA256}" \
            --arg desc "${DESC}" \
            --arg homepage "${HOMEPAGE}" \
            --arg source_repo "${SOURCE_REPO}" \
            --arg binary "${BINARY}" \
            --arg test_match "${TEST_MATCH}" \
            --arg license "${LICENSE}" \
            --arg service_config "${SERVICE_CONFIG}" \
            --arg service_run_args "${SERVICE_RUN_ARGS}" \
            --arg service_config_source "${SERVICE_CONFIG_SOURCE}" \
            '{
              event_type: "update-formula",
              client_payload: {
                formula: $formula,
                version: $version,
                url: $url,
                sha256: $sha256,
                desc: $desc,
                homepage: $homepage,
                source_repo: $source_repo,
                binary: $binary,
                test_match: $test_match,
                license: $license,
                service_config: $service_config,
                service_run_args: $service_run_args,
                service_config_source: $service_config_source
              }
            }' | gh api repos/novr/homebrew-taps/dispatches --method POST --input -
